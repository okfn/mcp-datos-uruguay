[project]
name = "mcp-ckan-datos-uruguay"
version = "0.1.0"
description = "Coleccion de herramientas MCP para datasets del portal de datos abiertos de Uruguay"
readme = "README.md"
authors = [
    { name = "OKFN", email = "info@okfn.org" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pydantic>=2.13,<3.0",
]

[project.scripts]
mcp-ckan-datos-uruguay = "mcp_ckan_datos_uruguay:main"

[project.entry-points."mcp_ckan"]
mcp-ckan-datos-uruguay = "mcp_ckan_datos_uruguay:register_tools"

[project.urls]
Homepage = "https://github.com/okfn/mcp-datos-uruguay"
Repository = "https://github.com/okfn/mcp-datos-uruguay"
Issues = "https://github.com/okfn/mcp-datos-uruguay/issues"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# E/F/W/C90 replace the flake8 + pycodestyle + pyflakes + mccabe defaults.
# RUF013 catches implicit Optional (`param: int = None`); Pydantic 2.13+
# rejects null arguments for such parameters at tool-call time.
select = ["E", "F", "W", "C90", "RUF013"]

[tool.ruff.lint.mccabe]
max-complexity = 16
